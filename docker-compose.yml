services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reswatch-retail-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - reswatch-retail-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: reswatch-retail-frontend
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - backend
    networks:
      - reswatch-retail-net

networks:
  reswatch-retail-net:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: "172.21.0.0/16"
        - subnet: "2001:db8:b::/64"
