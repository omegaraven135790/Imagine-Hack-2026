services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reswatch-retail-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    networks:
      - reswatch-retail-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: reswatch-retail-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - reswatch-retail-net

networks:
  reswatch-retail-net:
    driver: bridge
